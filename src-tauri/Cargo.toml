[package]
name = "my-home-assistant"
version = "0.1.0"
description = "Compagnon Home Assistant léger pour Windows 11"
authors = ["jcf2108"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "my_home_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-updater = { version = "2.5", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-process = "2.2"
tauri-plugin-autostart = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
