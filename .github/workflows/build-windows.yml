name: Build Windows Installer & Auto-Updater (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe + latest.json)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: "true"

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare version & preflight signing key check
        id: prep
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REPO_SLUG: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            function normalizeKey(raw) {
              if (!raw || !raw.trim()) return "";
              const t = raw.trim();
              if (t.startsWith("untrusted comment:")) {
                return Buffer.from(t.replace(/\r\n/g, "\n") + "\n", "utf8").toString("base64");
              }
              return t.replace(/\s+/g, "");
            }

            const cleanKey = normalizeKey(process.env.RAW_SIGNING_KEY || "");
            let hasValidSigningKey = false;

            if (cleanKey) {
              console.log("::add-mask::" + cleanKey);
              try {
                fs.writeFileSync("sigcheck.tmp", "ok");
                execSync("npx tauri signer sign sigcheck.tmp", {
                  env: {
                    ...process.env,
                    TAURI_SIGNING_PRIVATE_KEY: cleanKey,
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
                  },
                  stdio: "pipe"
                });
                hasValidSigningKey = true;
              } catch (err) {
                const msg = ((err.stderr && err.stderr.toString()) || err.message || "signer error")
                  .replace(/\r?\n/g, " | ")
                  .slice(0, 300);
                console.log("::warning title=Signature auto-update désactivée::" + msg);
                hasValidSigningKey = false;
              } finally {
                fs.rmSync("sigcheck.tmp", { force: true });
                fs.rmSync("sigcheck.tmp.sig", { force: true });
              }
            }

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const [major, minor] = pkg.version.split(".");
            const nextVersion = `${major}.${minor}.${process.env.RUN_NUM}`;
            pkg.version = nextVersion;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            const tauriConfPath = "src-tauri/tauri.conf.json";
            const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
            tauriConf.version = nextVersion;
            tauriConf.plugins.updater.endpoints = [
              `https://github.com/${process.env.REPO_SLUG}/releases/latest/download/latest.json`
            ];
            if (!hasValidSigningKey) {
              tauriConf.bundle.createUpdaterArtifacts = false;
            }
            fs.writeFileSync(tauriConfPath, JSON.stringify(tauriConf, null, 2) + "\n");

            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = ".*"$/m, `version = "${nextVersion}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${nextVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_signing_key=${hasValidSigningKey}\n`);
          '

      - name: Build Tauri Windows NSIS Installer
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          USE_SIGNING: ${{ steps.prep.outputs.has_signing_key }}
        run: |
          set -o pipefail
          if [ "$USE_SIGNING" = "true" ]; then
            CLEAN_KEY="$(node -e '
              const raw = (process.env.RAW_SIGNING_KEY || "").trim();
              if (raw.startsWith("untrusted comment:")) {
                process.stdout.write(Buffer.from(raw.replace(/\r\n/g, "\n") + "\n", "utf8").toString("base64"));
              } else {
                process.stdout.write(raw.replace(/\s+/g, ""));
              }
            ')"
            echo "::add-mask::$CLEAN_KEY"
            export TAURI_SIGNING_PRIVATE_KEY="$CLEAN_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi

          if ! npx tauri build --bundles nsis 2>&1 | tee tauri-build.log; then
            ERR_SUMMARY="$(tail -n 25 tauri-build.log | tr '\r\n' '  ' | cut -c 1-600)"
            echo "::error title=Tauri Build Failed::$ERR_SUMMARY"
            rm -f tauri-build.log
            exit 1
          fi
          rm -f tauri-build.log

      - name: Generate latest.json for Tauri Auto-Updater
        if: steps.prep.outputs.has_signing_key == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          TAG: ${{ steps.prep.outputs.tag }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const nsisDir = "src-tauri/target/release/bundle/nsis";
            const files = fs.readdirSync(nsisDir);
            const exeFile = files.find((f) => f.endsWith("-setup.exe") || f.endsWith(".exe"));
            const sigFile = files.find((f) => f.endsWith(".exe.sig"));
            if (!exeFile || !sigFile) {
              throw new Error("Binaire NSIS ou signature .sig introuvable dans " + nsisDir);
            }
            const signature = fs.readFileSync(path.join(nsisDir, sigFile), "utf8").trim();
            const encodedExe = encodeURIComponent(exeFile);
            const manifest = {
              version: process.env.VERSION,
              notes: `MyHomeAssistant v${process.env.VERSION}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature,
                  url: `https://github.com/${process.env.REPO_SLUG}/releases/download/${process.env.TAG}/${encodedExe}`
                }
              }
            };
            fs.writeFileSync(path.join(nsisDir, "latest.json"), JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MyHomeAssistant-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          retention-days: 30

      - name: Publish GitHub Release (Latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: MyHomeAssistant ${{ steps.prep.outputs.tag }} (Windows x64)
          make_latest: true
          body: |
            Installateur Windows 10/11 x64 (`MyHomeAssistant_${{ steps.prep.outputs.version }}_x64-setup.exe`) et manifeste de mise à jour automatique (`latest.json`).
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          generate_release_notes: false
